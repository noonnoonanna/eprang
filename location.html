<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>(주)이피랑</title>
</head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<link rel="stylesheet" href="css/styles.css" />
<script>
	//햄버거메뉴
	document.addEventListener('DOMContentLoaded', function () {
		const toggleBtn = document.querySelector('.menu-toggle');
		const nav = document.querySelector('nav');
	
		if (toggleBtn && nav) {
			toggleBtn.addEventListener('click', () => {
				nav.classList.toggle('active');
			});
		}
	
		const mainItems = document.querySelectorAll('.main-menu > li > a');
		mainItems.forEach(item => {
			item.addEventListener('click', (e) => {
				const parentLi = item.parentElement;
				if (window.innerWidth <= 768) {
					const subMenu = parentLi.querySelector('.submenu');
					if (subMenu) {
						e.preventDefault();
						parentLi.classList.toggle('open');
					}
				}
			});
		});
	});
</script>
<script>
	//지도 fade-in 효과
	document.addEventListener('DOMContentLoaded', () => {
		const elements = document.querySelectorAll('.fade-in');
		const observer = new IntersectionObserver(entries => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
				entry.target.classList.add('visible');
				observer.unobserve(entry.target); // 한 번만 실행하려면
				}
			});
		}, {
			threshold: 0.1
		});
	
		elements.forEach(el => observer.observe(el));
	});
</script>
<style>
/* 지도 라벨(정보창) 커스텀 */
.map-label {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;          /* 여백 타이트하게 */
  background: #fff;
  border: 1px solid #1f4d3a;  /* 테두리 정돈 */
  border-radius: 4px;
  font-size: 16px;
  line-height: 1.2;           /* 텍스트 수직 중심 */
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
  white-space: nowrap;
}

/* 아래 삼각 화살표 */
.map-label::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: -6px;               /* 화살표 높이만큼 내려 붙이기 */
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 6px solid #fff; /* 내부색 */
  /* 테두리 느낌을 주고 싶으면 아래 한 줄 추가 */
  filter: drop-shadow(0 -1px 0 #1f4d3a);
}
</style>
<body>
	<header>
		<div class="inner">
			<div class="inner-top">
				<a href="index.html" class="logo-link" aria-label="이피랑 로고">

      			</a>

						<li><a href="#">고객센터</a></li>
						<li><a href="location.html">오시는 길</a></li>
					</ul>
				</nav>
				<a href="https://www.instagram.com/eprang_official/#">
					<div class="instar_logo"><img src="images/Instagram_logo.png" alt="인스타그램 로고"></div>
				</a>
			</div>
			<button class="menu-toggle" aria-label="메뉴 열기">☰</button>
		</div>
	</header>
	
	<div class="wrap">
		<div class="container">
			<div class="content">
				<div class="sub_banner">
					오시는 길
				</div>
				<div class="map_container">
					<!--<div class="fade-in">Office<div id="office_map"></div></div>-->
					<div class="fade-in"><div id="fac_map"></div></div>
				</div>
				<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8cfbccd03d7ee80ea73496965b3babec"></script>
				<script>
					const fac_container = document.getElementById('fac_map');
					const markerPosition = new kakao.maps.LatLng(37.621496722728, 126.74029283932);

					const fac_map = new kakao.maps.Map(fac_container, {
  						center: markerPosition,
  						level: 2
					});

					const fac_marker = new kakao.maps.Marker({
  						position: markerPosition,
  						map: fac_map
					});

					// 커스텀 오버레이 컨텐츠
					const label = document.createElement('div');
					label.className = 'map-label';
					label.textContent = '(주)이피랑';

					// 오버레이 생성
					const fac_overlay = new kakao.maps.CustomOverlay({
  						position: markerPosition,
  						content: label,
  						map: fac_map,
  						yAnchor: 1.3   // 마커 꼭지와의 간격 미세조정 (1.2~1.6 사이 시도 권장)  ← 확실하지 않음: 화면 DPI/콘텐츠 높이에 따라 값이 달라질 수 있음
 						// xAnchor: 0.5 // 가로 중앙 정렬(기본 0.5, 필요시 조정)
					});
				</script>
			</div>
		</div>
	</div>

	<footer>

			<span class="f-text">법인명(상호): (주)이피랑</span><span class="f-text">주소: 경기도 김포시 고촌읍 상미로9번길 41</span><br>
			<span class="f-text">Copyright ⓒ 2025 이피랑 All Rights Reserved.</span>
		</div>
	</footer>
</body>

</html>
