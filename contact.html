   :root {
  --leafA:#bfead5;
  --leafB:#dff6ea;
  --leafC:#cfe6ff;
  --leafD:#ffe3b0;
}
.sub-banner.leaf {
  position: relative;
  height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(1000px 520px at 15% 25%, #f3fbf7 0%, #ffffff 60%);
  overflow: hidden;
}
.sub-banner.leaf h1 {
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 800;
  letter-spacing: -0.3px;
  position: relative;
  z-index: 2;
}
.leafy {
  position: absolute;
  opacity: 0.8;
  filter: blur(0.1px);
  pointer-events: none;
}
.leafy svg {display: block;}
.leafy.a {left: 8%; top: 10%; animation: sway1 9s ease-in-out infinite;}
.leafy.b {right: 10%; top: 20%; animation: sway2 11s ease-in-out infinite;}
.leafy.c {left: 20%; bottom: -10px; animation: sway3 13s ease-in-out infinite;}
.leafy.d {right: 24%; bottom: -8px; animation: sway1 10s 1s ease-in-out infinite;}
@keyframes sway1 {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes sway2 {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(-5deg)}}
@keyframes sway3 {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(6deg)}}
@media(max-width:680px){
  .sub-banner.leaf{height:340px; background: radial-gradient(800px 300px at 50% 40%, #f5fbf8 0%, #ffffff 80%);}  
  .leafy{opacity:0.65; filter:blur(0.3px);}  
  .leafy svg{transform:scale(0.8);}  
  .leafy.a{left:-7%; top:6%;}
  .leafy.b{right:4%; top:10%;}
  .leafy.c{left:2%; bottom:-2%;}
  .leafy.c svg{width:150px; height:150px;}
  .leafy.d{right:12%; bottom:-4%;}
}

    .sub-banner.contact{height:280px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--leaf2),#fff);text-align:center}

    .form-card{background:linear-gradient(180deg,#fdfefe,#f6fbf8);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:26px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .grid .full{grid-column:1/-1}

    label{font-weight:700;display:block;margin:6px 0 6px}
    input[type="text"], input[type="email"], textarea{width:100%;padding:14px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}
    input:focus, textarea:focus{box-shadow:0 0 0 4px color-mix(in oklab, var(--brand) 24%, transparent)}
    textarea{min-height:160px;resize:vertical}

    .actions{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:18px}
    .btn{appearance:none;border:none;border-radius:999px;padding:14px 22px;font-weight:800;cursor:pointer}
    .btn.primary{background:var(--brand);color:#fff}
    .btn.ghost{background:#fff;border:1px solid var(--border);color:var(--ink-600)}

    .helper{color:var(--ink-400);font-size:13px;margin-top:6px}
    .note{background:var(--brand-100);border:1px dashed var(--brand-700);color:var(--ink-600);padding:12px;border-radius:12px;margin:16px 0}

    /* 모바일 */
    @media(max-width:760px){.grid{grid-template-columns:1fr}}
	.form-card{position:relative}
/* 성공 레이어 스타일 */
.success-layer{position:absolute; inset:0; display:grid; place-items:center; background:rgba(255,255,255,.65); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .25s ease}
.success-layer.show{opacity:1; pointer-events:auto}
.success-card{background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:0 16px 44px rgba(0,0,0,.12); padding:26px 22px; text-align:center; width:min(420px, 92vw); animation:pop .24s ease-out}
@keyframes pop{from{transform:scale(.96); opacity:.9}to{transform:scale(1); opacity:1}}
.check{width:84px; height:84px; display:block; margin:6px auto 12px}
.check .ring{fill:none; stroke:var(--leaf2); stroke-width:8}
.check .mark{fill:none; stroke:var(--brand); stroke-linecap:round; stroke-linejoin:round; stroke-width:6; stroke-dasharray:60; stroke-dashoffset:60; transition:stroke-dashoffset .6s ease .1s}
.check.draw .mark{stroke-dashoffset:0}
.msg{color:var(--ink-600); line-height:1.7; margin:6px 0 12px}

  <script>
	function formSubmit(e){
		e.preventDefault();
		const form = e.target;
		const panel = document.getElementById('success-panel');
		// Netlify AJAX 제출
		const data = new FormData(form);
		// Netlify는 x-www-form-urlencoded 필요 => 변환
		const payload = new URLSearchParams(data).toString();
		fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: payload })
		.then(()=>{
		form.reset();
		// 레이어 표시 + 체크 애니메이션
		if(panel){
		panel.hidden = false;
		requestAnimationFrame(()=>{
		panel.classList.add('show');
		const chk = panel.querySelector('.check');
		if(chk) chk.classList.add('draw');
		});
		const closer = panel.querySelector('.close-success');
		closer && closer.addEventListener('click', ()=> hideSuccess(panel));
		document.addEventListener('keydown', escClose);
		}
		})
		.catch(()=>{
		// 실패 시 사용자에게 안내
		alert('제출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
		});
		return false; // 기본 submit(페이지 이동) 차단
	}
function hideSuccess(panel){ panel.classList.remove('show'); setTimeout(()=>{ panel.hidden = true; }, 220); document.removeEventListener('keydown', escClose); }
function escClose(e){ if(e.key === 'Escape'){ const panel = document.getElementById('success-panel'); if(panel && !panel.hidden) hideSuccess(panel); } }
</script>
